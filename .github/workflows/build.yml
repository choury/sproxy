name: build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "*" ]

env:
  project: sproxy
  #boringssl无版本发布，固定到具体commit保证可复现，升级时更新此值
  BORINGSSL_REF: a074f282d026a0ebbed7c9efef5a0cf63f72338d

jobs:
  build-ubuntu:
    strategy:
      matrix:
        # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
        build_type: [RelWithDebInfo, Debug]
        os: [ubuntu-24.04, ubuntu-22.04]
        env: ["CC=gcc CXX=g++", "CC=clang CXX=clang++"]
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{matrix.os}}

    steps:
    - name: Set environment
      run: echo ${{matrix.env}} | tr ' ' '\n' >> $GITHUB_ENV
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: install pkg
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ninja-build libz-dev libjson-c-dev libelf-dev libreadline-dev liburing-dev libjemalloc-dev libxml2-dev binutils-bpf
    - name: Cache BoringSSL
      id: cache-boringssl
      uses: actions/cache@v4
      with:
        path: ~/openssl
        key: boringssl-linux-${{matrix.os}}-${{env.BORINGSSL_REF}}-${{env.CC}}-${{hashFiles('**/build.yml')}}
    - name: 'build and install boringssl'
      if: steps.cache-boringssl.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 https://github.com/google/boringssl
        cd boringssl
        git fetch --depth=1 origin ${{ env.BORINGSSL_REF }}
        git checkout ${{ env.BORINGSSL_REF }}
        cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=0 -DCMAKE_INSTALL_PREFIX=$HOME/openssl -B build
        ninja -C build ssl crypto bssl
        #必须用cmake --install：include/openssl下是指向源码树的符号链接，手动cp会拷出死链
        cmake --install build
    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: ${{matrix.env}} cmake -B ${{github.workspace}}/build -DUSE_BORINGSSL=1 -DOPENSSL_ROOT_DIR=$HOME/openssl -DCMAKE_BUILD_TYPE=${{matrix.build_type}}

    - name: build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{matrix.build_type}} --parallel `nproc`
    - if: matrix.build_type != 'Debug'
      name: pack
      run: cpack -G DEB -B ${{github.workspace}}/build  --config ${{github.workspace}}/build/CPackConfig.cmake
    - if: matrix.build_type != 'Debug'
      name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: ${{matrix.os}}-${{env.CC}}.deb
        path: build/*.deb
    - if: matrix.build_type == 'Debug'
      name: test
      run: cd ${{github.workspace}}/test && sudo sysctl -w net.ipv4.ping_group_range='0 2147483647' && ./test.sh ../build/
      timeout-minutes: 10
    - if: ${{ matrix.build_type == 'Debug' && always() }}
      name: Upload test log
      uses: actions/upload-artifact@v4
      with:
        name: test-log-${{matrix.os}}-${{env.CC}}
        path: test/*.log
        if-no-files-found: ignore
  build-debian:
    name: build-debian
    strategy:
      matrix:
        include:
        - image: debian:12
          name: debian-12
          cargo-name: cargo-web
        - image: debian:trixie-backports
          name: debian-13
          cargo-name: -t trixie-backports cargo
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
    - name: Install Build Dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git build-essential cmake ninja-build pkg-config ca-certificates \
        libz-dev libjson-c-dev libelf-dev libreadline-dev liburing-dev libjemalloc-dev libxml2-dev
        apt-get install -y --no-install-recommends ${{matrix.cargo-name}}
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Fix Git Safe Directory
      run: git config --global --add safe.directory '*'
    - name: Cache BoringSSL
      id: cache-boringssl
      uses: actions/cache@v4
      with:
        path: ~/openssl
        key: boringssl-${{ matrix.image }}-${{ env.BORINGSSL_REF }}-${{ hashFiles('.github/workflows/build.yml') }}
    - name: 'Build and install BoringSSL'
      if: steps.cache-boringssl.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 https://github.com/google/boringssl
        cd boringssl
        git fetch --depth=1 origin ${{ env.BORINGSSL_REF }}
        git checkout ${{ env.BORINGSSL_REF }}
        cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=0 -DCMAKE_INSTALL_PREFIX=$HOME/openssl -B build
        ninja -C build ssl crypto bssl
        #必须用cmake --install：include/openssl下是指向源码树的符号链接，手动cp会拷出死链
        cmake --install build
    - name: Configure CMake
      run: cmake -B build -DUSE_BORINGSSL=1 -DOPENSSL_ROOT_DIR=$HOME/openssl -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - name: Build
      run: cmake --build build --config RelWithDebInfo --parallel `nproc`
    - name: Pack
      run: cpack -G DEB -B build --config build/CPackConfig.cmake
    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}-deb
        path: build/*.deb
  build-alpine:
    name: build-alpine
    strategy:
      matrix:
        include:
        - image: alpine:3.20
          name: alpine-3.20
        - image: alpine:3.21
          name: alpine-3.21
        - image: alpine:3.22
          name: alpine-3.22
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
    - name: Install Build Dependencies
      run: |
        apk update
        apk add build-base cmake ninja git linux-headers perl zlib-dev json-c-dev elfutils-dev readline-dev liburing-dev jemalloc-dev libxml2-dev tar pkgconf ruby ruby-dev libffi-dev
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Fix Git Safe Directory
      run: git config --global --add safe.directory '*'
    - name: Cache BoringSSL
      id: cache-boringssl
      uses: actions/cache@v4
      with:
        path: ~/openssl
        key: boringssl-${{ matrix.image }}-${{ env.BORINGSSL_REF }}-${{ hashFiles('.github/workflows/build.yml') }}
    - name: 'Build and install BoringSSL'
      if: steps.cache-boringssl.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 https://github.com/google/boringssl
        cd boringssl
        git fetch --depth=1 origin ${{ env.BORINGSSL_REF }}
        git checkout ${{ env.BORINGSSL_REF }}
        cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=0 -DCMAKE_INSTALL_PREFIX=$HOME/openssl -B build
        ninja -C build ssl crypto bssl
        #必须用cmake --install：include/openssl下是指向源码树的符号链接，手动cp会拷出死链
        cmake --install build
    - name: Configure CMake
      run: cmake -B build -DUSE_BORINGSSL=1 -DOPENSSL_ROOT_DIR=$HOME/openssl -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - name: Build
      run: cmake --build build --config RelWithDebInfo --parallel `nproc`
    - name: Pack
      run: |
        gem install fpm --no-document
        VERSION=$(git describe --tag --dirty --long --always | sed 's/^v//')
        mkdir -p install_root
        DESTDIR=$(pwd)/install_root cmake --install build --prefix /usr
        install -D -m 755 packaging/alpine/sproxy.init install_root/etc/init.d/sproxy
        mkdir -p install_root/etc/sproxy
        fpm -s dir -t apk -n sproxy -v "$VERSION" -C install_root \
          -p build/sproxy_"${VERSION}"_"${{matrix.name}}".apk \
          --depends "zlib" \
          --depends "json-c" \
          --depends "libelf" \
          --depends "readline" \
          --depends "liburing" \
          --depends "jemalloc" \
          --depends "libxml2" \
          --description "sproxy is a high-performance HTTP/HTTP2/HTTP3 proxy server with VPN capabilities" \
          --url "https://github.com/choury/sproxy" \
          --maintainer "choury <zhouwei400@gmail.com>" \
          .
    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}-apk
        path: build/*.apk
  build-macos:
    strategy:
      matrix:
        # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
        build_type: [RelWithDebInfo, Debug]
        os: [macos-15, macos-14]
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Cache BoringSSL
      id: cache-boringssl-macos
      uses: actions/cache@v4
      with:
        path: ~/openssl
        key: boringssl-macos-${{matrix.os}}-${{env.BORINGSSL_REF}}-${{hashFiles('**/build.yml')}}
    - name: 'build and install boringssl'
      if: steps.cache-boringssl-macos.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 https://github.com/google/boringssl
        cd boringssl
        git fetch --depth=1 origin ${{ env.BORINGSSL_REF }}
        git checkout ${{ env.BORINGSSL_REF }}
        cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=0 -DCMAKE_INSTALL_PREFIX=$HOME/openssl -B build
        ninja -C build ssl crypto bssl
        #必须用cmake --install：include/openssl下是指向源码树的符号链接，手动cp会拷出死链
        cmake --install build
    - name: install pkg
      run: brew install ninja json-c coreutils libxml2
    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DUSE_BORINGSSL=1 -DOPENSSL_ROOT_DIR=$HOME/openssl -DCMAKE_BUILD_TYPE=${{matrix.build_type}}

    - name: build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{matrix.build_type}}  --parallel `nproc`
    - if: matrix.build_type != 'Debug'
      name: pack
      run: cpack -G TGZ -B ${{github.workspace}}/build  --config ${{github.workspace}}/build/CPackConfig.cmake
    - if: matrix.build_type != 'Debug'
      name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: ${{matrix.os}}-${{github.job}}.tgz
        path: build/*.gz
    - if: matrix.build_type == 'Debug'
      name: test
      run: cd ${{github.workspace}}/test && ./test.sh ../build/
      timeout-minutes: 10
    - if: ${{ matrix.build_type == 'Debug' && always() }}
      name: Upload test log
      uses: actions/upload-artifact@v4
      with:
        name: test-log-${{matrix.os}}
        path: test/*.log
        if-no-files-found: ignore

